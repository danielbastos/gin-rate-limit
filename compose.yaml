services:
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ratelimit
      POSTGRES_USER: ratelimit
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimit -d ratelimit"]
      interval: 1s
      timeout: 3s
      retries: 30
