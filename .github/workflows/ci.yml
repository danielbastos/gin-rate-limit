name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./... -count=1

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ratelimit
          POSTGRES_USER: ratelimit
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratelimit -d ratelimit"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      RATELIMIT_REQUIRE_INTEGRATION: "1"
      RATELIMIT_REDIS_ADDR: 127.0.0.1:6379
      RATELIMIT_POSTGRES_DSN: postgres://ratelimit:ci-test-only@127.0.0.1:5432/ratelimit?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
