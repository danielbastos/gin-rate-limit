name: CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Do not silently upgrade Go when checking the minimum supported version.
  GOTOOLCHAIN: local

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module consistency
        run: go mod tidy -diff
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Run Staticcheck
        run: staticcheck ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check vulnerabilities
        run: govulncheck ./...

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race ./... -count=1

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ratelimit
          POSTGRES_USER: ratelimit
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratelimit -d ratelimit"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      RATELIMIT_REQUIRE_INTEGRATION: "1"
      RATELIMIT_REDIS_ADDR: 127.0.0.1:6379
      RATELIMIT_POSTGRES_DSN: postgres://ratelimit:ci-test-only@127.0.0.1:5432/ratelimit?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
